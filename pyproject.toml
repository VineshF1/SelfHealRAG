[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-rag"
version = "0.1.0"
description = "Self-Healing RAG — LangGraph cyclical critique-and-correct pipeline with NVIDIA NIM embeddings."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0,<2.0.0",
    "openai>=1.0.0,<2.0.0",
    "langgraph>=0.4.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "typing-extensions>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
self-healing-rag = "self_healing_rag.main:main"
